<html lang="pt-br">
<head>
    <title>Login</title>
<link rel="stylesheet" type="text/css" href="stylesheet.css" media="screen" />
</head>
<body>
    <div class="flexix">
    <div class="item1">
        <h1>Login</h1>
    <form class="Nome">
        <p> Nome:
            <input type="text" id="inNome" class="imputext"> 
            <input type="submit" id="submitlogin" value="pronto" class="imputcolor">
        </p>
        <p> Senha:
            <input type="password" id="inSenha" class="imputext">
        </form>
        <form class="cadastrar">
    </div>
        <div class="item2">
            <p>Cadastrar-se:</p>
          <p>  Nome:   
            <input type="text" id="inNomec" class="imputext"> 
            <input type="submit" id="prontoc" value="pronto" class="imputcolor">
            <p>Senha:
            <input type="password" id="inSenhac" class="imputext">
        </p>
        </form>
        </div>
    </div>
    <div>
<a href="parcerias.html">parcerias.html</a>
    <script>
        const frm = document.querySelector(".Nome");
        const loginInput = document.getElementById("inNome");
        const senhaInput = document.getElementById("inSenha");
        const evento1 = document.getElementById("submitlogin");

        const frm2 = document.querySelector(".cadastrar");
        const loginInput2 = document.getElementById("inNomec");
        const senhaInput2 = document.getElementById("inSenhac");
        const evento2 = document.getElementById("prontoc")

        const users = [
            { username: 'murilo', password: 'dagostim' },
            { username: 'lucas', password: 'fernandes' },
            { username: 'robertinho', password: 'carlinhos' },
            { username: 'roberto', password: 'carlos' }
        ];

        evento2.addEventListener("click", (e) => {
            e.preventDefault();
            newlogin = loginInput2.value
            newpassword = senhaInput2.value
            users.push({ username: newlogin, password: newpassword }) 
            alert("tenta fazer login agora rapais")
        });
        evento1.addEventListener("click", (e) => {// o "=>" define que na esquerda '<' seja a função e a direita '>' seja o corpo da função 
        // // o .find é para o primeiro elemento da lista array atende uma condição especifica basicalmente ele faz a função a cima em todos os elementos da lista caso de primeira n der :)
            e.preventDefault();
            const login = loginInput.value;
            const senha = senhaInput.value;
            
            const user = users.find(user => user.username === login && user.password === senha);

            if (user) {
                alert("Bem-vindo!");
                window.location.href="parcerias.html";
            } else {
                alert("Senha ou nome de usuário incorretos!");
            }
        });
    </script>
    </div>
</body>
</html>
